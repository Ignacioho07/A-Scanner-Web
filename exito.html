<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        A-Scanner Ultra | Verificando pago
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .success-container {
            text-align: center;
            max-width: 560px;
            margin: 100px auto;
            padding: 50px;
            border-radius: 16px;
        }

        .status-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .status-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .status-text {
            color: var(--platinum-dark);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .action-btn {
            display: none;
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            color: white;
            background: #2AABEE;
        }

        .retry-btn {
            margin-top: 12px;
            background: transparent;
            color: var(--platinum-dark);
            border: 1px solid var(--graphite-border);
        }

    </style>

</head>


<body>

    <div class="bg-glow glow-red"></div>


    <div
        class="success-container glass-panel"
    >

        <div
            id="status-icon"
            class="status-icon"
        >
            ⏳
        </div>


        <h1
            id="status-title"
            class="status-title"
        >
            Verificando tu suscripción
        </h1>


        <p
            id="status-text"
            class="status-text"
        >
            Mercado Pago nos está confirmando el estado de tu membresía.
            Esto normalmente tarda unos segundos.
        </p>


        <button
            id="btn-radar"
            class="action-btn"
        >
            🚀 Entrar a A-Scanner Ultra
        </button>


        <button
            id="btn-retry"
            class="action-btn retry-btn"
        >
            Volver a verificar
        </button>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";


        const API_BASE =
            "https://a-scanner-server.onrender.com";


        const firebaseConfig = {

            apiKey:
                "AIzaSyAwWCCHsbAtAhTof-_M4ACa1uiQxc1CcWI",

            authDomain:
                "scanner-app-c00e9.firebaseapp.com",

            projectId:
                "scanner-app-c00e9",

            storageBucket:
                "scanner-app-c00e9.firebasestorage.app",

            messagingSenderId:
                "236724650270",

            appId:
                "1:236724650270:web:88d34f611a1154ff24890f"
        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const title =
            document.getElementById(
                "status-title"
            );

        const text =
            document.getElementById(
                "status-text"
            );

        const icon =
            document.getElementById(
                "status-icon"
            );

        const btnRadar =
            document.getElementById(
                "btn-radar"
            );

        const btnRetry =
            document.getElementById(
                "btn-retry"
            );


        function sleep(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );
        }


        async function getEstado(
            user
        ) {

            const token =
                await user.getIdToken();


            const response =
                await fetch(
                    `${API_BASE}/mi-estado`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "No se pudo consultar la cuenta"
                );
            }


            return response.json();
        }


        function mostrarActivo() {

            icon.innerText =
                "✅";

            title.innerText =
                "¡Membresía activada!";

            text.innerText =
                "Mercado Pago confirmó tu suscripción. Ya podés ingresar al radar.";

            btnRadar.style.display =
                "block";

            btnRetry.style.display =
                "none";
        }


        function mostrarPendiente() {

            icon.innerText =
                "⏳";

            title.innerText =
                "El pago todavía se está verificando";

            text.innerText =
                "No hace falta volver a pagar. Si Mercado Pago aprobó la suscripción, el acceso se activará cuando llegue la confirmación.";

            btnRetry.style.display =
                "block";
        }


        async function verificar(
            user,
            intentos = 15
        ) {

            for (
                let i = 0;
                i < intentos;
                i++
            ) {

                try {

                    const estado =
                        await getEstado(
                            user
                        );


                    if (
                        estado.isPremium
                    ) {

                        mostrarActivo();

                        return;
                    }

                } catch (error) {

                    console.error(
                        error
                    );
                }


                await sleep(2000);
            }


            mostrarPendiente();
        }


        onAuthStateChanged(
            auth,
            user => {

                if (!user) {

                    alert(
                        "Iniciá sesión nuevamente para verificar tu suscripción."
                    );

                    window.location.href =
                        "index.html";

                    return;
                }


                verificar(user);
            }
        );


        btnRadar.addEventListener(
            "click",
            () => {

                window.location.href =
                    "radar.html";
            }
        );


        btnRetry.addEventListener(
            "click",
            () => {

                btnRetry.style.display =
                    "none";


                const user =
                    auth.currentUser;


                if (user) {

                    verificar(user);
                }
            }
        );

    </script>

</body>

</html>
