<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        A-Scanner Ultra | Acceso al Radar
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        .portal {

            text-align: center;
            max-width: 540px;
            margin: 100px auto;
            padding: 50px;
            border-radius: 16px;
        }


        .portal p {

            color: var(--platinum-dark);
            line-height: 1.6;
            margin-top: 15px;
        }


        .btn-telegram {

            width: 100%;
            margin-top: 25px;
            padding: 18px;

            border: 0;
            border-radius: 8px;

            background: #2AABEE;
            color: white;

            font-size: 1rem;
            font-weight: 800;

            cursor: pointer;

            text-decoration: none;

            display: block;
        }


        #link-container {

            display: none;
        }

    </style>

</head>


<body>

    <div class="bg-glow glow-red"></div>


    <div
        class="portal glass-panel"
    >

        <h1>
            Portal A-Scanner Ultra
        </h1>


        <p id="status">
            Verificando tu membresía…
        </p>


        <button
            id="btn-reclamar"
            class="btn-telegram"
            disabled
        >
            Verificando acceso…
        </button>


        <div id="link-container">

            <p>
                Tu acceso fue generado.
                El enlace es personal,
                de un solo uso y vence
                en unos minutos.
            </p>


            <a
                id="vip-link"
                class="btn-telegram"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Entrar al Telegram Ultra
            </a>

        </div>

    </div>


    <script type="module">

        import {

            initializeApp

        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";


        import {

            getAuth,
            onAuthStateChanged

        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";


        const API_BASE =
            "https://a-scanner-server.onrender.com";


        const firebaseConfig = {

            apiKey:
                "AIzaSyAwWCCHsbAtAhTof-_M4ACa1uiQxc1CcWI",

            authDomain:
                "scanner-app-c00e9.firebaseapp.com",

            projectId:
                "scanner-app-c00e9",

            storageBucket:
                "scanner-app-c00e9.firebasestorage.app",

            messagingSenderId:
                "236724650270",

            appId:
                "1:236724650270:web:88d34f611a1154ff24890f"
        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const btn =
            document.getElementById(
                "btn-reclamar"
            );


        const status =
            document.getElementById(
                "status"
            );


        const linkContainer =
            document.getElementById(
                "link-container"
            );


        const vipLink =
            document.getElementById(
                "vip-link"
            );


        async function apiFetch(
            user,
            path,
            options = {}
        ) {

            const token =
                await user.getIdToken();


            const response =
                await fetch(
                    `${API_BASE}${path}`,
                    {
                        ...options,

                        headers: {

                            "Content-Type":
                                "application/json",

                            Authorization:
                                `Bearer ${token}`,

                            ...(options.headers || {})
                        }
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch (_) {}


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Error de acceso"
                );
            }


            return data;
        }


        onAuthStateChanged(
            auth,
            async user => {

                if (!user) {

                    alert(
                        "Iniciá sesión para acceder."
                    );

                    window.location.href =
                        "index.html";

                    return;
                }


                try {

                    const estado =
                        await apiFetch(
                            user,
                            "/mi-estado"
                        );


                    if (
                        !estado.isPremium
                    ) {

                        alert(
                            "Tu cuenta no posee una suscripción Ultra activa."
                        );

                        window.location.href =
                            "index.html";

                        return;
                    }


                    status.innerText =
                        "Tu membresía está activa. Podés generar tu enlace personal.";


                    btn.disabled =
                        false;


                    btn.innerText =
                        "🔑 Generar mi acceso único";


                } catch (error) {

                    console.error(
                        error
                    );


                    status.innerText =
                        "No pudimos verificar tu cuenta.";
                }
            }
        );


        btn.addEventListener(
            "click",
            async () => {

                const user =
                    auth.currentUser;


                if (!user) {
                    return;
                }


                btn.disabled =
                    true;


                btn.innerText =
                    "Generando acceso…";


                try {

                    const data =
                        await apiFetch(
                            user,
                            "/generar-acceso-vip",
                            {
                                method:
                                    "POST"
                            }
                        );


                    vipLink.href =
                        data.link;


                    linkContainer.style.display =
                        "block";


                    btn.style.display =
                        "none";


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "❌ " +
                        error.message
                    );


                    btn.disabled =
                        false;


                    btn.innerText =
                        "🔑 Reintentar";
                }
            }
        );

    </script>

</body>

</html>
